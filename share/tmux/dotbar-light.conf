# tmux-dotbar — light (Kanagawa Lotus)
#
# Derived from colors/kanagawa-lotus.toml, the light Alacritty palette, so the
# same "status bar disappears into the terminal" trick holds as in dark: bg is
# that file's colors.primary.background verbatim.
#
#   fg-current  primary.foreground  — the active window, highest contrast
#   fg          bright.black        — inactive windows, deliberately faint
#   fg-session  lotusGray2          — between the two, as #737c73 is in dark.
#                                     From the upstream palette, not the 16
#                                     terminal colours, which have no mid grey.
#   fg-prefix   normal.cyan         — the dragon palette uses its cyan here too
set -g @tmux-dotbar-bg          "#f2ecbc"
set -g @tmux-dotbar-fg          "#8a8980"
set -g @tmux-dotbar-fg-current  "#545464"
set -g @tmux-dotbar-fg-session  "#716e61"
set -g @tmux-dotbar-fg-prefix   "#597b75"
