# tmux-dotbar — dark (Kanagawa Dragon)
#
# The background is the whole point: #181616 is Alacritty's kanagawa_dragon
# background, so the status bar disappears into the terminal instead of drawing
# a line across it. Change one and you must change the other.
#
# Sourced twice over: once from .tmux.conf as the fallback, and again via the
# generated ~/.tmux/theme.conf when alacritty-theme picks the dark variant.
set -g @tmux-dotbar-bg          "#181616"
set -g @tmux-dotbar-fg          "#625e5a"
set -g @tmux-dotbar-fg-current  "#c5c9c5"
set -g @tmux-dotbar-fg-session  "#737c73"
set -g @tmux-dotbar-fg-prefix   "#8ea4a2"
