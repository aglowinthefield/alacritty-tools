# -----------------------------------------------------------------------------
# Kanagawa Lotus  (light)
#
# Vendored verbatim from the colorscheme's official Alacritty extra:
#   rebelot/kanagawa.nvim @ b5d990e  extras/alacritty/kanagawa_lotus.toml
# Do not hand-tune. Re-copy from upstream after updating the plugin, otherwise
# the terminal and editor palettes drift apart.
#
# This is the light half of the pair whose dark half is kanagawa_dragon, and the
# same theme herdr switches itself to ([theme] light_name = "kanagawa-lotus"),
# so terminal and sidebar agree in light mode the way they do in dark.
#
# Kept here rather than in themes/ because that directory is a checkout of
# alacritty/alacritty-theme, which ships only wave and dragon.
# -----------------------------------------------------------------------------


[colors.primary]
background = '#f2ecbc'
foreground = '#545464'

[colors.normal]
black = "#1f1f28"
red = "#c84053"
green = "#6f894e"
yellow = "#77713f"
blue = "#4d699b"
magenta = "#b35b79"
cyan = "#597b75"
white = "#545464"

[colors.bright]
black = "#8a8980"
red = "#d7474b"
green = "#6e915f"
yellow = "#836f4a"
blue = "#6693bf"
magenta = "#624c83"
cyan = "#5e857a"
white = "#43436c"

[colors.selection]
background = '#c9cbd1'
foreground = '#dcd7ba'

[[colors.indexed_colors]]
index = 16
color = '#e98a00'

[[colors.indexed_colors]]
index = 17
color = '#e82424'
